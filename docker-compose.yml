services:
  travel-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-mcp-server
    ports:
      - "8000:8000"
    environment:
      # Server Configuration
      - TRAVEL_SERVER_NAME=travel-mcp-server
      - TRAVEL_VERSION=1.0.0
      - TRAVEL_HOST=0.0.0.0
      - TRAVEL_PORT=8000

      # MCP Configuration
      - TRAVEL_MCP_HOST=0.0.0.0
      - TRAVEL_MCP_PORT=8000

      # Performance Configuration
      - TRAVEL_MAX_CONCURRENT_REQUESTS=100
      - TRAVEL_REQUEST_TIMEOUT=30.0

      # Data Source Configuration
      # Set to false and configure API keys for real APIs
      - TRAVEL_USE_MOCK_DATA=true

      # Security Configuration
      # Uncomment and set API key for production
      # - TRAVEL_API_KEY=your-secure-api-key
      - TRAVEL_RATE_LIMIT_PER_MINUTE=60

      # Monitoring Configuration
      - TRAVEL_LOG_LEVEL=INFO
      - TRAVEL_METRICS_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - travel-mcp-network

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: travel-mcp-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - travel-mcp-server
    networks:
      - travel-mcp-network
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: travel-mcp-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - travel-mcp-network
    profiles:
      - monitoring

networks:
  travel-mcp-network:
    driver: bridge

volumes:
  grafana-data:
